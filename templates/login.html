{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 border border-gray-100 my-6">
    <!-- Abas para alternar entre Login e Cadastro -->
    <div class="flex border-b border-gray-200 mb-6">
        <button id="tab-login" onclick="switchTab('login')" class="w-1/2 py-2 text-center font-bold text-amber-600 border-b-2 border-amber-500 focus:outline-none">
            Acessar Conta
        </button>
        <button id="tab-cadastro" onclick="switchTab('cadastro')" class="w-1/2 py-2 text-center font-bold text-gray-400 hover:text-slate-800 focus:outline-none">
            Criar Conta
        </button>
    </div>

    <!-- FORMULÁRIO DE LOGIN -->
    <form id="form-login" method="POST" action="{{ url_for('login') }}" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="seu@email.com">
        </div>
        
        <div>
            <div class="flex justify-between items-center mb-1">
                <label class="block text-sm font-medium text-gray-700">Senha</label>
                <!-- Link Esqueci a Senha -->
                <a href="#" onclick="alert('Instruções de recuperação enviadas para o e-mail cadastrado (Funcionalidade simulada para protótipo).')" class="text-xs text-amber-600 hover:underline">Esqueci a senha?</a>
            </div>
            <input type="password" name="senha" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="******">
        </div>
        
        <button type="submit" class="w-full bg-slate-900 text-white font-semibold py-2.5 rounded-lg hover:bg-slate-800 transition text-sm">Entrar</button>
        
        <div class="mt-4 text-center text-xs text-gray-500 pt-2 border-t">
            <p>Dica de teste (Admin gerado no seed): <br><strong>admin@imobiliaria.com</strong> / Senha: <strong>123456</strong></p>
        </div>
    </form>

    <!-- FORMULÁRIO DE CADASTRO DE CLIENTE -->
    <form id="form-cadastro" method="POST" action="{{ url_for('cadastrar_cliente') }}" class="space-y-4 hidden">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Nome Completo</label>
            <input type="text" name="nome" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="Seu nome completo">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="seu@email.com">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Telefone / WhatsApp</label>
            <input type="tel" name="telefone" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="(11) 99999-9999">
        </div>
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input type="password" name="senha" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none text-sm" placeholder="Crie uma senha segura">
        </div>
        
        <button type="submit" class="w-full bg-amber-500 text-slate-900 font-bold py-2.5 rounded-lg hover:bg-amber-400 transition text-sm">Criar Minha Conta</button>
    </form>
</div>

<script>
function switchTab(type) {
    const formLogin = document.getElementById('form-login');
    const formCadastro = document.getElementById('form-cadastro');
    const tabLogin = document.getElementById('tab-login');
    const tabCadastro = document.getElementById('tab-cadastro');

    if (type === 'login') {
        formLogin.classList.remove('hidden');
        formCadastro.classList.add('hidden');
        tabLogin.className = "w-1/2 py-2 text-center font-bold text-amber-600 border-b-2 border-amber-500 focus:outline-none";
        tabCadastro.className = "w-1/2 py-2 text-center font-bold text-gray-400 hover:text-slate-800 focus:outline-none";
    } else {
        formLogin.classList.add('hidden');
        formCadastro.classList.remove('hidden');
        tabCadastro.className = "w-1/2 py-2 text-center font-bold text-amber-600 border-b-2 border-amber-500 focus:outline-none";
        tabLogin.className = "w-1/2 py-2 text-center font-bold text-gray-400 hover:text-slate-800 focus:outline-none";
    }
}
</script>
{% endblock %}
