{% extends "base.html" %}
{% block content %}
<div class="max-w-3xl mx-auto bg-white p-8 rounded-lg shadow border">
    <h1 class="text-2xl font-bold mb-6 text-slate-900">Cadastrar Novo Imóvel de Alto Padrão</h1>
    <form method="POST" class="space-y-6">
        
        <h2 class="font-bold text-amber-600 border-b pb-2">1. Informações Públicas (Vitrine)</h2>
        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold">Código</label>
                <input type="text" name="codigo" placeholder="AP0002" required class="w-full p-2 border rounded">
            </div>
            <div class="col-span-2">
                <label class="block text-xs font-semibold">Título do Anúncio</label>
                <input type="text" name="titulo" required class="w-full p-2 border rounded">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold">Tipo</label>
                <select name="tipo" class="w-full p-2 border rounded">
                    <option value="apartamento">Apartamento</option>
                    <option value="cobertura">Cobertura</option>
                    <option value="casa">Casa de Condomínio</option>
                    <option value="comercial">Conjunto Comercial</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-semibold">Valor Venda (R$)</label>
                <input type="number" step="0.01" name="preco_venda" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-xs font-semibold">Bairro (Público)</label>
                <input type="text" name="bairro" required class="w-full p-2 border rounded">
            </div>
        </div>

        <div class="grid grid-cols-4 gap-4">
            <div>
                <label class="block text-xs font-semibold">Área Útil (m²)</label>
                <input type="number" name="area_util" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-xs font-semibold">Suítes</label>
                <input type="number" name="suites" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-xs font-semibold">Banheiros</label>
                <input type="number" name="banheiros" class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-xs font-semibold">Vagas</label>
                <input type="number" name="vagas" class="w-full p-2 border rounded">
            </div>
        </div>

        <div>
            <label class="block text-xs font-semibold">Foto Principal (Caminho na pasta static)</label>
            <input type="text" name="foto_capa" placeholder="ap0001/01-sala.webp" class="w-full p-2 border rounded text-sm">
        </div>

        <div class="flex items-center gap-2 mt-4">
            <input type="checkbox" name="destaque" id="destaque" class="w-4 h-4 text-amber-500 rounded border-gray-300">
            <label for="destaque" class="text-sm font-semibold text-slate-800">Colocar este imóvel em destaque na Home?</label>
        </div>

        <h2 class="font-bold text-amber-600 border-b pb-2 pt-4">2. Dados Privados (Liberados Apenas Após Login)</h2>
        <div class="grid grid-cols-3 gap-4">
            <div class="col-span-2">
                <label class="block text-xs font-semibold">Logradouro / Rua Exata</label>
                <input type="text" name="logradouro" required class="w-full p-2 border rounded">
            </div>
            <div>
                <label class="block text-xs font-semibold">Número / Comp.</label>
                <input type="text" name="numero" required class="w-full p-2 border rounded">
            </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-xs font-semibold">Andar</label>
                <input type="number" name="andar" placeholder="14" class="w-full p-2 border rounded">
            </div>
            <div class="col-span-2">
                <label class="block text-xs font-semibold">Posição Solar / Iluminação</label>
                <input type="text" name="posicao_solar" placeholder="Face Norte (Sol da Manhã)" class="w-full p-2 border rounded">
            </div>
        </div>

        <button type="submit" class="w-full bg-slate-900 text-white py-3 rounded font-bold hover:bg-slate-800">Salvar Imóvel</button>
    </form>
</div>
{% endblock %}
