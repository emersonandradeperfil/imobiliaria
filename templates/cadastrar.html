{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-8 border border-gray-100">
    <h1 class="text-2xl font-bold text-slate-900 mb-6 text-center">Criar Conta Cliente</h1>
    <form method="POST" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-gray-700">Nome Completo</label>
            <input type="text" name="nome" required class="w-full px-4 py-2 border rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">E-mail</label>
            <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Telefone / WhatsApp</label>
            <input type="text" name="telefone" required class="w-full px-4 py-2 border rounded-lg text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700">Senha</label>
            <input type="password" name="senha" required class="w-full px-4 py-2 border rounded-lg text-sm">
        </div>
        <button type="submit" class="w-full bg-amber-500 text-slate-900 font-semibold py-2.5 rounded-lg hover:bg-amber-400 text-sm">Cadastrar</button>
    </form>
</div>
{% endblock %}
