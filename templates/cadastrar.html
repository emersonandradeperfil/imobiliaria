{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-gray-100 my-12 text-slate-900">
    <div class="text-center mb-6">
        <span class="text-3xl">📝</span>
        <h1 class="text-2xl font-extrabold text-slate-900 mt-2">Crie sua Conta</h1>
        <p class="text-xs text-gray-500 mt-1">Cadastre-se para favoritar imóveis e agendar visitas facilmente.</p>
    </div>

    <!-- Formulário de Cadastro Inicial -->
    <form id="form-cadastro" onsubmit="iniciarCadastroOtp(event)" class="space-y-4">
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome Completo</label>
            <input type="text" id="cad-nome" required placeholder="Seu nome"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail</label>
            <input type="email" id="cad-email" required placeholder="seu@email.com"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>

        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Senha</label>
            <input type="password" id="cad-senha" required placeholder="Sua senha segura"
                class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-slate-900">
        </div>

        <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">WhatsApp / Celular</label>
            <input type="tel" id="imovel-lead-whatsapp" required placeholder="11999999999" maxlength="11"
                oninput="this.value = this.value.replace(/\D/g, '')"
                class="w-full bg-gray-50 border border-gray-300 rounded-xl px-3 py-2 text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-400">
        </div>

        <button type="submit" class="w-full bg-slate-900 hover:bg-amber-400 hover:text-slate-950 text-white font-bold py-3.5 rounded-xl transition text-sm shadow-md cursor-pointer">
            Avançar e Enviar Código
        </button>
    </form>

    <div class="text-center mt-6 text-xs text-gray-500">
        Já tem uma conta? <a href="{{ url_for('login') }}" class="font-bold text-slate-900 hover:underline">Fazer login</a>
    </div>
</div>

<!-- MODAL DE VERIFICAÇÃO OTP PARA CADASTRO -->
<div id="modal-otp-cadastro" class="fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 sm:p-8 text-slate-900 relative">
        <button onclick="fecharModalOtpCadastro()" class="absolute top-4 right-4 text-gray-400 hover:text-slate-800 text-xl font-bold">×</button>
        
        <div class="text-center mb-6">
            <span class="text-3xl">✉️</span>
            <h3 class="text-xl font-extrabold text-slate-900 mt-2">Confirme seu E-mail</h3>
            <p class="text-xs text-gray-500 mt-1">Enviamos um código de verificação para <span id="span-email-cad" class="font-bold text-slate-800"></span>.</p>
        </div>

        <form onsubmit="confirmarOtpCadastro(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1 text-center">Digite o Código de Verificação</label>
                <input type="text" id="input-codigo-otp-cad" required placeholder="Ex: 1234" maxlength="6"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl text-center text-xl font-bold tracking-widest text-slate-900 focus:outline-none focus:ring-2 focus:ring-slate-900">
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-amber-500 hover:text-slate-950 text-white font-bold py-3 rounded-xl transition text-sm shadow-md cursor-pointer">
                Confirmar e Concluir Cadastro
            </button>
        </form>
    </div>
</div>

<script>
    async function iniciarCadastroOtp(event) {
        event.preventDefault();
        let nome = document.getElementById('cad-nome').value;
        let email = document.getElementById('cad-email').value;
        let senha = document.getElementById('cad-senha').value;
        let telefone = document.getElementById('cad-telefone').value;

        try {
            let response = await fetch('/api/enviar-otp-cadastro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha, telefone })
            });
            let data = await response.json();

            if (data.status === 'success') {
                document.getElementById('span-email-cad').textContent = email;
                document.getElementById('modal-otp-cadastro').classList.remove('hidden');
            } else {
                alert(data.message || 'Erro ao enviar código. Tente novamente.');
            }
        } catch (error) {
            console.error('Erro ao enviar OTP de cadastro:', error);
            alert('Erro de conexão ao enviar o código.');
        }
    }

    function fecharModalOtpCadastro() {
        document.getElementById('modal-otp-cadastro').classList.add('hidden');
    }

    async function confirmarOtpCadastro(event) {
        event.preventDefault();
        let codigo = document.getElementById('input-codigo-otp-cad').value;
        let email = document.getElementById('span-email-cad').textContent;

        try {
            let response = await fetch('/api/verificar-otp-e-cadastrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, codigo })
            });
            let data = await response.json();

            if (data.status === 'success') {
                alert('Cadastro realizado com sucesso! Faça login para continuar.');
                window.location.href = "{{ url_for('login') }}";
            } else {
                alert(data.message || 'Código incorreto!');
            }
        } catch (error) {
            console.error('Erro ao verificar OTP de cadastro:', error);
            alert('Erro ao validar o código.');
        }
    }
</script>
{% endblock %}
