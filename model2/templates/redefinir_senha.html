{% extends "base.html" %}
{% block content %}
<section class="secao estreito">
  <h1>Nova senha</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nova senha (mín. 8 caracteres) <input type="password" name="senha" minlength="8" required autofocus></label>
    <label>Repita a nova senha <input type="password" name="confirmacao" minlength="8" required></label>
    <button class="btn bloco">Salvar nova senha</button>
  </form>
</section>
{% endblock %}
