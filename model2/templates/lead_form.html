{% extends "base.html" %}
{% block title %}{{ cfg.titulo }} · {{ config.NOME_SITE }}{% endblock %}
{% block content %}
<section class="secao estreito">
  <h1>{{ cfg.titulo }}</h1>
  <p>{{ cfg.intro }}</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <label>Nome <input name="nome" value="{{ form.get('nome', '') }}" required></label>
    <label>E-mail <input type="email" name="email" value="{{ form.get('email', '') }}" required></label>
    <label>Telefone (com DDD) <input name="telefone" value="{{ form.get('telefone', '') }}" required></label>
    {% for campo, rotulo in cfg.extras %}
      <label>{{ rotulo }} <input name="{{ campo }}" value="{{ form.get(campo, '') }}"></label>
    {% endfor %}
    <label>Mensagem <textarea name="mensagem" rows="4" maxlength="2000">{{ form.get('mensagem', '') }}</textarea></label>
    <label class="check"><input type="checkbox" name="aceite_lgpd" required>
      Li e aceito a <a href="{{ url_for('public.privacidade') }}" target="_blank">Política de Privacidade</a>.</label>
    <button class="btn bloco">Enviar</button>
  </form>
</section>
{% endblock %}
