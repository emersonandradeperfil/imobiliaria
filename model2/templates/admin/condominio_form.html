{% extends "base.html" %}
{% block content %}
<section class="secao">
  <h1>{{ 'Editar ' + condo.nome if condo else 'Novo condomínio' }}</h1>
  <p><a href="{{ url_for('admin.condominios') }}">← Voltar para a lista</a></p>
  <form method="post" class="form-admin">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <fieldset><legend>Dados</legend>
      <label>Nome <input name="nome" value="{{ v.get('nome', '') }}" maxlength="120" required></label>
      <label>Descrição <textarea name="descricao" rows="5" maxlength="5000">{{ v.get('descricao', '') }}</textarea></label>
      <div class="linha-campos">
        <label>Bairro <input name="bairro" value="{{ v.get('bairro', '') }}" required></label>
        <label>Cidade <input name="cidade" value="{{ v.get('cidade', '') }}" required></label>
        <label>UF <input name="estado" value="{{ v.get('estado', '') }}" maxlength="2" required></label>
      </div>
      <label>Comodidades (separadas por vírgula) <input name="comodidades" value="{{ v.get('comodidades', '') }}"></label>
      <label class="check"><input type="checkbox" name="administrado_pela_imobiliaria" {{ 'checked' if v.get('administrado_pela_imobiliaria') }}> Administrado pela imobiliária</label>
      <label class="check"><input type="checkbox" name="ativo" {{ 'checked' if v.get('ativo') }}> Ativo (aparece nas páginas dos imóveis)</label>
    </fieldset>
    <fieldset><legend>Mídia</legend>
      <label>Fotos — uma por linha: <code>arquivo | legenda</code> (pasta <code>static/img/condominios/</code>)
        <textarea name="fotos" rows="5" placeholder="villa-aurora/01.webp | Fachada">{{ v.get('fotos', '') }}</textarea></label>
      <label>Link do vídeo <input name="video_url" value="{{ v.get('video_url', '') }}"></label>
      <label>Link do tour virtual 360° (https) <input name="tour_url" value="{{ v.get('tour_url', '') }}"></label>
    </fieldset>
    <button class="btn">Salvar</button>
  </form>
</section>
{% endblock %}
