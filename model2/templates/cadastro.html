{% extends "base.html" %}
{% block content %}
<section class="secao estreito">
  <h1>Criar cadastro</h1>
  <p class="meta">Para a segurança dos nossos corretores e dos proprietários, pedimos alguns dados antes de liberar endereços e visitas.</p>
  <form method="post" action="{{ url_for('auth.cadastro', next=request.args.get('next')) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome completo <input name="nome" value="{{ form.get('nome', '') }}" required></label>
    <label>E-mail <input type="email" name="email" value="{{ form.get('email', '') }}" required></label>
    <label>Telefone (com DDD) <input name="telefone" value="{{ form.get('telefone', '') }}" required></label>
    <label>CPF {% if not config.EXIGIR_DOCUMENTO %}(opcional){% endif %}
      <input name="documento" value="{{ form.get('documento', '') }}" {{ 'required' if config.EXIGIR_DOCUMENTO }}></label>
    <label>Senha (mín. 8 caracteres) <input type="password" name="senha" minlength="8" required></label>
    <label class="check"><input type="checkbox" name="aceite_lgpd" required>
      Li e aceito a <a href="{{ url_for('public.privacidade') }}" target="_blank">Política de Privacidade</a>.</label>
    <button class="btn bloco">Cadastrar</button>
  </form>
</section>
{% endblock %}
