<form class="filtros" method="get" action="{{ url_for('public.listagem') }}">
  <select name="finalidade">
    <option value="">Comprar ou alugar</option>
    <option value="venda" {{ 'selected' if f.get('finalidade') == 'venda' }}>Comprar</option>
    <option value="locacao" {{ 'selected' if f.get('finalidade') == 'locacao' }}>Alugar</option>
  </select>
  <select name="categoria">
    <option value="">Residencial e comercial</option>
    <option value="residencial" {{ 'selected' if f.get('categoria') == 'residencial' }}>Residencial</option>
    <option value="comercial" {{ 'selected' if f.get('categoria') == 'comercial' }}>Comercial</option>
  </select>
  <select name="bairro">
    <option value="">Todos os bairros</option>
    {% for b in bairros %}<option {{ 'selected' if f.get('bairro') == b }}>{{ b }}</option>{% endfor %}
  </select>
  <select name="quartos">
    <option value="">Dormitórios</option>
    {% for n in (1, 2, 3, 4) %}<option value="{{ n }}" {{ 'selected' if f.get('quartos') == n|string }}>{{ n }}+</option>{% endfor %}
  </select>
  <input name="preco_max" type="number" min="0" placeholder="Valor máximo (R$)" value="{{ f.get('preco_max', '') }}">
  <button class="btn">Buscar</button>
</form>
